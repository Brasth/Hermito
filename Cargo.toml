[workspace]
members = ["crates/hermito", "crates/hermito-protocol", "crates/hermito-remote"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
directories = "6.0"
futures-util = "0.3"
ignore = "0.4"
hex = "0.4"
libc = "0.2"
portable-pty = "0.9"
lsp-types = "0.97"
ratatui = { version = "0.30.2", features = ["crossterm"] }
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tough = { version = "=0.21.0", default-features = false }
toml = "0.9"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-highlight = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
